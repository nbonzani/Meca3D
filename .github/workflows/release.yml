name: Release

# Étiquette v* : construction, tests de l'exécutable, zip, création de la Release avec le zip.
# workflow_dispatch : construction et tests seulement ; le zip est un artefact du workflow,
# aucune Release n'est créée.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exe:
    runs-on: windows-latest
    permissions:
      contents: write # création de la Release (étiquette v* uniquement)
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      # setup-uv n'a pas d'étiquette de version majeure mobile : version exacte (R11)
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv python install 3.12
      - run: uv sync --locked
      - name: Construction de l'exécutable (PyInstaller, mode dossier)
        run: uv run pyinstaller meca3d.spec --noconfirm
      - name: Tests de l'exécutable
        env:
          MECA3D_EXE_DIR: dist/meca3d
        run: uv run pytest -q -m slow tests/test_exe.py
      - name: Exemples et guide utilisateur dans le dossier livré
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/meca3d/exemples | Out-Null
          Copy-Item exemples/*.meca3d dist/meca3d/exemples/
          Copy-Item exemples/maquettes dist/meca3d/exemples/maquettes -Recurse
          Copy-Item docs/guide/Meca3D_Guide_utilisateur.pdf dist/meca3d/
      - name: Archive zip du dossier
        shell: pwsh
        run: |
          $nom = "Meca3D-${{ github.ref_type == 'tag' && github.ref_name || github.sha }}-windows-x64.zip"
          Compress-Archive -Path dist/meca3d -DestinationPath $nom
          "ARCHIVE=$nom" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Artefact de workflow (déclenchement manuel)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: meca3d-windows-x64
          path: ${{ env.ARCHIVE }}
      - name: Release GitHub (étiquette v*)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.ARCHIVE }}
          generate_release_notes: true
