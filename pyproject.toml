[project]
name = "meca3d"
version = "0.1.0"
description = "Outil pédagogique de mécanique des solides indéformables : SolidCraft + Exudyn"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dependencies = [
    "exudyn==1.13.6",
    "numpy>=1.26",
    "networkx>=3.2",
    "sympy>=1.12",
    "PyQt6>=6.6",
    "matplotlib>=3.8",
]

[project.scripts]
meca3d = "meca3d.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meca3d"]

[dependency-groups]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.6", "pyright>=1.1.380"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["decade_archive", "prototypes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
typeCheckingMode = "standard"
include = ["src", "tests"]
exclude = ["decade_archive", "prototypes", "**/.venv"]
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: test long (plus de 10 s)",
    "solidcraft: test contre le vrai SolidCraft lancé avec --control 7878 (manuel)",
]
addopts = "-m 'not solidcraft'"
